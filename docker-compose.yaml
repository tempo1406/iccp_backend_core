version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: postgres_17_container
    env_file:
      - .env.${NODE_ENV:-dev}
    environment:
      POSTGRES_USER: ${POSTGRE_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRE_DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRE_DATABASE_NAME}
    ports:
      - "5433:${POSTGRE_DATABASE_PORT}"
      # - '${POSTGRE_DATABASE_PORT}:${POSTGRE_DATABASE_PORT}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "${REDIS_DATABASE_PORT}:${REDIS_DATABASE_PORT}"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app-network

  office-preview-renderer:
    container_name: office-preview-renderer
    build:
      context: .
      dockerfile: tools/office-preview-renderer/Dockerfile
    environment:
      PORT: 4010
      PUBLIC_BASE_URL: http://localhost:4010
      DATA_DIR: /app/data
    ports:
      - "4010:4010"
    volumes:
      - office_preview_renderer_data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  iccp-be-core:
    container_name: iccp-be-core
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.${NODE_ENV:-dev}
    environment:
      NODE_ENV: ${NODE_ENV:-dev}
      CHAT_BOX_OFFICE_PREVIEW_RENDERER_ENDPOINT: http://office-preview-renderer:4010/api/render-office-preview
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - postgres
      - office-preview-renderer
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
    networks:
      - app-network
      - iccp-network

volumes:
  postgres_data:
  redis_data:
  office_preview_renderer_data:

networks:
  app-network:
    driver: bridge
  iccp-network:
    external: true
    name: iccp-network
