global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'iccp-be-core'
    metrics_path: /metrics
    static_configs:
      - targets: ['iccp-be-core:3333']

  - job_name: 'iccp-be-ai'
    metrics_path: /metrics
    static_configs:
      - targets: ['iccp-be-ai:8001']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['iccp_node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['iccp_cadvisor:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['iccp_postgres_exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['iccp_redis_exporter:9121']

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['iccp_mongodb_exporter:9216']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://iccp-be-core:3333/health
          - http://iccp-be-ai:8001/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: iccp_blackbox_exporter:9115
