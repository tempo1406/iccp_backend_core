version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: postgres_prod
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRE_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRE_DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRE_DATABASE_NAME}
    ports:
      - ${POSTGRE_DATABASE_PORT}:${POSTGRE_DATABASE_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRE_DATABASE_USERNAME} -d ${POSTGRE_DATABASE_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:latest
    container_name: redis_prod
    ports:
      - ${REDIS_DATABASE_PORT}:6379
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  office-preview-renderer:
    container_name: office-preview-renderer-prod
    build:
      context: .
      dockerfile: tools/office-preview-renderer/Dockerfile
    environment:
      PORT: 4010
      PUBLIC_BASE_URL: http://office-preview-renderer:4010
      DATA_DIR: /app/data
    volumes:
      - office_preview_renderer_data:/app/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4010/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  iccp-be-core:
    container_name: iccp-be-core-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - .env.prod
    environment:
      NODE_ENV: prod
      CHAT_BOX_OFFICE_PREVIEW_RENDERER_ENDPOINT: http://office-preview-renderer:4010/api/render-office-preview
    ports:
      - ${APP_PORT}:${APP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      office-preview-renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
      - iccp-network

  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - iccp-be-core
    restart: always
    networks:
      - app-network
      - iccp-network

volumes:
  postgres_data:
  redis_data:
  office_preview_renderer_data:
  nginx_cache:

networks:
  app-network:
    driver: bridge
  iccp-network:
    external: true
    name: iccp-network
