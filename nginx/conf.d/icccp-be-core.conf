server {
    listen 80;
    server_name api-core-iccp.wyndev.me;

    # Bật redirect HTTP → HTTPS sau khi có SSL cert
    return 301 https://$host$request_uri;

    location / {
        # APP_PORT phải khớp với APP_PORT trong .env.prod (hiện tại: 8080)
        proxy_pass         http://iccp-be-core-prod:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeout
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer
        proxy_buffer_size       4k;
        proxy_buffers           4 32k;
        proxy_busy_buffers_size 64k;
    }

    # Health check — không ghi log để tránh spam
    location /health {
        access_log off;
        proxy_pass http://iccp-be-core-prod:8080/health;
    }
}

server {
    listen 443 ssl;
    server_name api-core-iccp.wyndev.me;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://iccp-be-core-prod:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
